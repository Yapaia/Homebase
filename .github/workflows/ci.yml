name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Bauen und testen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run bau

  image:
    name: Image bauen und im Container prüfen
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t homebase:test .
      - name: Starten (ohne Domain, Port 8088, Vorschau an)
        run: |
          docker run -d --name hb --network host -e HTTP_PORT=8088 -e STANDARD_DESIGN=kompass homebase:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8088/healthz && break; sleep 1; done
      - name: Prüfen
        run: |
          set -e
          B=http://127.0.0.1:8088
          pruefe() { echo "→ $1"; }
          pruefe "Start leitet nach Sprache um"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' $B/)" = "$B/de/"
          test "$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Accept-Language: en-GB' $B/)" = "$B/en/"
          pruefe "Standard-Design aus STANDARD_DESIGN"
          curl -fsS $B/de/ | grep -q 'data-design="kompass"'
          pruefe "Cookie wählt das Design"
          for d in horizont kompass logbuch; do
            curl -fsS -H "Cookie: design=$d" $B/de/ | grep -q "data-design=\"$d\""
            curl -fsS -H "Cookie: design=$d" $B/en/docs/technik/protokoll/ | grep -q "data-design=\"$d\""
          done
          pruefe "Unbekanntes Design fällt auf den Standard zurück"
          curl -fsS -H "Cookie: design=../../etc" $B/de/ | grep -q 'data-design="kompass"'
          pruefe "/design/<name> setzt das Cookie"
          curl -fsS -D - -o /dev/null $B/design/logbuch | grep -qi 'set-cookie: design=logbuch'
          pruefe "Vorschau-Leiste wird ausgeliefert"
          curl -fsS $B/_vorschau.js | grep -q 'Design-Vorschau'
          pruefe "404 in der richtigen Sprache"
          test "$(curl -s -o /dev/null -w '%{http_code}' $B/de/gibt-es-nicht/)" = "404"
          curl -s $B/en/missing/ | grep -q 'lang="en"'
          pruefe "Stylesheet, Schriften und Bilder"
          curl -fsS -H 'Cookie: design=logbuch' -o /dev/null $B/assets/logbuch.css
          curl -fsS -H 'Cookie: design=logbuch' -o /dev/null $B/assets/schriften/fraunces-latin-wght-normal.woff2
          curl -fsS -o /dev/null $B/assets/bilder/beat-dashboard.png
          pruefe "Sicherheits-Kopfzeilen"
          curl -fsS -D - -o /dev/null $B/de/ | grep -qi 'x-content-type-options: nosniff'
          docker rm -f hb
      - name: Vorschau aus
        run: |
          docker run -d --name hb2 --network host -e HTTP_PORT=8089 -e VORSCHAU=0 homebase:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8089/healthz && break; sleep 1; done
          test -z "$(curl -fsS http://127.0.0.1:8089/_vorschau.js)"
          curl -fsS http://127.0.0.1:8089/de/ | grep -q 'data-design="horizont"'
          docker rm -f hb2
      - name: Konfiguration mit Domain und Kartenserver ist gültig
        run: |
          docker run --rm -e SEITE_DOMAIN=example.org -e SEITE_WWW=ja -e KARTEN_DOMAIN=karten.example.org -e NUR_KONFIG=1 -e CADDYFILE=/tmp/C --entrypoint sh homebase:test -c 'homebase-start && caddy validate --config /tmp/C --adapter caddyfile'
      - name: Veröffentlichen (nur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag homebase:test ghcr.io/yapaia/homebase:$tag
            docker push ghcr.io/yapaia/homebase:$tag
          done
